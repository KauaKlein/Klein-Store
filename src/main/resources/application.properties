spring.application.name=klein-store

# Banco H2 salvo em arquivo local (mantém os dados ao reiniciar)
spring.datasource.url=jdbc:h2:file:./data/gamevaultdb;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Google OAuth2 (substitua pelas suas credenciais do Google Cloud Console ou defina como variáveis de ambiente)
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:placeholder-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:placeholder-client-secret}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# Chave fixa para manter login salvo ("lembrar senha sempre")
app.remember-me.key=${REMEMBER_ME_KEY:klein-store-persistent-secret-2026}
